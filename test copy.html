<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Dropdowns Example</title>
    <style>
      .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }
      .show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="dropdown">
      <button class="dropdown-button">Dropdown 1</button>
      <div class="dropdown-content">
        <p>Option 1-1</p>
        <p>Option 1-2</p>
        <p>Option 1-3</p>
      </div>
    </div>

    <div class="dropdown">
      <button class="dropdown-button">Dropdown 2</button>
      <div class="dropdown-content">
        <p>Option 2-1</p>
        <p>Option 2-2</p>
        <p>Option 2-3</p>
      </div>
    </div>

    <div class="dropdown">
      <button class="dropdown-button">Dropdown 3</button>
      <div class="dropdown-content">
        <p>Option 3-1</p>
        <p>Option 3-2</p>
        <p>Option 3-3</p>
      </div>
    </div>

    <script>
      const dropdownButtons =
        document.getElementsByClassName("dropdown-button");
      const dropdownContents =
        document.getElementsByClassName("dropdown-content");

      // Afficher ou cacher le contenu du dropdown au clic sur le bouton
      for (let i = 0; i < dropdownButtons.length; i++) {
        dropdownButtons[i].addEventListener("click", function (event) {
          dropdownContents[i].classList.toggle("show");
          event.stopPropagation(); // Empêche le clic de se propager au document
        });
      }

      // Enlever la classe 'show' si on clique en dehors des dropdowns
      document.addEventListener("click", function (event) {
        for (let i = 0; i < dropdownContents.length; i++) {
          if (
            !dropdownContents[i].contains(event.target) &&
            !dropdownButtons[i].contains(event.target)
          ) {
            dropdownContents[i].classList.remove("show");
          }
        }
      });
    </script>
  </body>
</html>
