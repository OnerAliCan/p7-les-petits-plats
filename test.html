<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Déplacer un élément</title>
    <style>
      .container {
        border: 1px solid #ccc;
        padding: 10px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div id="source" class="container">
      <p id="element">Cliquez sur moi pour me déplacer</p>
    </div>

    <div id="destination" class="container">
      <p>Ici, je vais être déplacé</p>
    </div>

    <script>
      // Sélectionner l'élément à déplacer
      const element = document.getElementById("element");

      // Ajouter un événement de clic
      element.addEventListener("click", function () {
        // Sélectionner la div de destination
        const destination = document.getElementById("destination");

        // Déplacer l'élément dans la div de destination
        destination.appendChild(element);
      });
    </script>
  </body>
</html>
